# Let __ASSERT do its job
CONFIG_DEBUG=y
CONFIG_REBOOT=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_WATCHDOG=y
CONFIG_PWM=y

CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
